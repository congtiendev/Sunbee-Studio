appId: com.sunbee.studio
productName: Sunbee Studio
publish:
  provider: github
  owner: congtiendev
  repo: Sunbee-Editor
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-server/**
  - dist-electron/**
  - build/icon.png
  - package.json
asarUnpack:
  - build/icon.png
  - node_modules/better-sqlite3/**
npmRebuild: true
linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
  synopsis: Sunbee Studio
  syncDesktopName: true
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
